    </g>
    <g fill="none" stroke="#a97a30" stroke-width="2.2" opacity=".55"><path d="M110 38l8 -10 M132 38l8 -10 M154 38l8 -10 M176 38l8 -10 M198 38l8 -10 M220 38l8 -10 M242 38l8 -10 M264 38l8 -10 M286 38l8 -10 M308 38l8 -10 M84 70l-8 -10 M106 70l-8 -10 M128 70l-8 -10 M150 70l-8 -10 M172 70l-8 -10 M194 70l-8 -10 M216 70l-8 -10 M238 70l-8 -10 M260 70l-8 -10 M282 70l-8 -10 M304 70l-8 -10 M326 70l-8 -10 M348 70l-8 -10 M70 104l8 -10 M92 104l8 -10 M114 104l8 -10 M136 104l8 -10 M158 104l8 -10 M180 104l8 -10 M202 104l8 -10 M224 104l8 -10 M246 104l8 -10 M268 104l8 -10 M290 104l8 -10 M312 104l8 -10 M334 104l8 -10 M356 104l8 -10"/></g>
    <!-- Brillo de la copa -->
