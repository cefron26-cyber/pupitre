    <linearGradient id="icinta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ec3a34"/><stop offset="1" stop-color="#c41f22"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-5 220 160)" stroke-linecap="round" stroke-linejoin="round">
